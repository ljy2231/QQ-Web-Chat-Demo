<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天界面 · 本机演示</title>
<style>
*{box-sizing:border-box} :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#334155;background:#e9eef5} body{margin:0} button,input,textarea{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px} [hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#cfe4ff,transparent 36%),radial-gradient(circle at 85% 80%,#fbe1ed,transparent 36%),#f4f6fa}.login-inner{width:min(100%,400px);text-align:center}.brand{font-size:36px;letter-spacing:.03em;font-weight:300;color:#1e293b;margin:0 0 12px}.subtitle{color:#64748b;font-size:14px;margin-bottom:32px}.card{background:#ffffffd9;border:1px solid #fff;border-radius:20px;padding:32px;box-shadow:0 20px 60px #64748b24;text-align:left}.card h2{margin:0 0 10px;font-size:20px}.muted{color:#64748b;font-size:13px;line-height:1.6}.card label,.settings label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}.field{width:100%;border:1px solid #dbe3ed;border-radius:10px;padding:11px;background:#fff;color:#334155}.primary{background:#5895ed;color:white;border:0;border-radius:9px;padding:10px 18px;font-weight:600}.login .primary{width:100%;margin-top:16px;background:#e989ae}.notice{font-size:12px;line-height:1.5;color:#91622a;background:#fff7e8;padding:9px 12px;border-bottom:1px solid #f5e4c5}.app{height:100dvh;display:flex;flex-direction:column;max-width:1600px;margin:auto;background:white;box-shadow:0 0 50px #64748b17}.workspace{display:flex;flex:1;min-height:0}.sidebar{width:288px;flex:none;border-right:1px solid #e5eaf0;display:flex;flex-direction:column;background:#fff}.side-head,.chat-head{height:64px;padding:0 18px;border-bottom:1px solid #e8edf3;display:flex;align-items:center;gap:10px;flex:none}.dot{width:9px;height:9px;border-radius:50%;background:#8bb7ee}.side-head strong{font-size:14px}.side-head small{margin-left:auto;color:#94a3b8}.contacts{overflow:auto;flex:1;padding:10px}.contact{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;color:inherit}.contact:hover,.contact.active{background:#eef5ff}.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#dceafe;color:#4978b7;font-weight:700;flex:none}.contact-info{flex:1;min-width:0}.contact-name{font-size:14px;font-weight:650}.preview{font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.badge{background:#ef7486;color:#fff;border-radius:20px;min-width:20px;text-align:center;padding:2px 5px;font-size:11px}.side-foot{padding:12px;border-top:1px solid #edf1f5;display:flex;gap:8px}.soft{border:1px solid #e1e8f0;background:white;border-radius:8px;padding:8px 11px;color:#64748b;font-size:12px}.side-foot .soft:last-child{margin-left:auto}.chat{display:flex;flex:1;min-width:0;flex-direction:column;background:var(--chat-bg,#f7f9fc)}.chat-head{background:#ffffffdf}.chat-head strong{font-size:16px}.chat-head small{display:block;color:#94a3b8;font-size:11px;margin-top:3px}.back{display:none}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px}.empty{margin:auto;color:#94a3b8;font-size:14px}.message{display:flex;gap:10px;align-items:flex-start;max-width:80%}.message.mine{align-self:flex-end;flex-direction:row-reverse}.message .avatar{width:34px;height:34px;border-radius:11px;font-size:12px}.message-content{min-width:0}.meta{font-size:11px;color:#94a3b8;margin-bottom:5px}.mine .meta{text-align:right}.bubble{background:#fff;border:1px solid #edf1f5;padding:10px 13px;border-radius:4px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}.mine .bubble{background:#dcecff;border-color:#dcecff;border-radius:14px 4px 14px 14px}.quoted{border-left:2px solid #9ab9de;color:#718096;font-size:12px;margin-bottom:8px;padding-left:7px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:5px}.mine .actions{justify-content:flex-end}.link{background:none;border:0;padding:0;color:#94a3b8;font-size:11px}.link:hover{color:#4384d8}.composer{background:#fff;border-top:1px solid #e8edf3;padding:12px 18px 16px}.quote-bar{display:flex;justify-content:space-between;align-items:center;background:#f3f6fa;color:#64748b;font-size:12px;border-radius:8px;padding:8px 10px;margin-bottom:8px;gap:8px}.quote-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.input-row{display:flex;align-items:end;gap:10px;background:#f7f9fc;border:1px solid #e8edf3;border-radius:12px;padding:6px}.input-row textarea{flex:1;min-width:0;resize:vertical;max-height:130px;border:0;background:transparent;padding:9px;outline:none}.hint{font-size:11px;color:#a1aebd;margin:7px 2px 0}.settings-wrap{position:fixed;inset:0;z-index:10;background:#1e293b66;display:grid;place-items:center;padding:16px}.settings{width:min(100%,570px);max-height:90dvh;overflow:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 20px 70px #0f172a44}.settings-header{display:flex;justify-content:space-between;align-items:center}.settings h2{margin:0;font-size:20px}.settings textarea{resize:vertical;min-height:65px}.settings .inline{display:flex;gap:10px;align-items:center}.settings input[type=color]{width:52px;height:36px;border:1px solid #e2e8f0;background:white;border-radius:6px}.settings input[type=checkbox]{width:17px;height:17px}.settings-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.danger{color:#bd4758}.status{color:#9a641d;font-size:12px;margin-top:10px;min-height:18px}.toast{position:fixed;z-index:20;bottom:24px;left:50%;transform:translateX(-50%);background:#334155;color:white;padding:10px 16px;border-radius:9px;font-size:13px;max-width:90%;text-align:center}
@media(max-width:700px){.sidebar{width:100%}.chat{display:none}.workspace.open .sidebar{display:none}.workspace.open .chat{display:flex;width:100%}.back{display:block;border:0;background:none;font-size:22px;color:#64748b;padding:0 5px 0 0}.messages{padding:18px 14px}.message{max-width:92%}.notice{font-size:11px}.settings{padding:18px}}
</style>
</head>
<body>
<section class="login" id="login"><div class="login-inner"><h1 class="brand">QQ Web Chat</h1><p class="subtitle">一个轻量的聊天界面演示</p><div class="card"><h2>进入演示</h2><p class="muted">无需账号或密码。请勿输入真实账号、密码或敏感信息。</p><label for="nickname">演示昵称（可选）</label><input class="field" id="nickname" maxlength="30" placeholder="例如：我"><button class="primary" id="enter">进入本机演示</button><p class="muted">所有消息仅保存在本机演示，不连接 QQ，也不会发送给任何人。</p></div></div></section>
<div class="app"><div class="notice">本机模拟演示 · 所有消息仅本机演示，不连接 QQ，不会实际发送。请勿输入真实账号、密码或敏感信息。<span id="storageNotice"></span></div><div class="workspace" id="workspace"><aside class="sidebar"><div class="side-head"><span class="dot"></span><strong>本机演示</strong><small>未连接网络</small></div><div class="contacts" id="contacts"></div><div class="side-foot"><button class="soft" id="logout">退出演示</button><button class="soft" id="reset">重置示例</button><button class="soft" id="openSettings">设置</button></div></aside><main class="chat"><header class="chat-head"><button class="back" id="back" aria-label="返回会话列表">‹</button><div><strong id="chatName">选择会话</strong><small>仅本机模拟 · 不连接 QQ</small></div></header><div class="messages" id="messages" aria-live="polite"></div><div class="composer"><div class="quote-bar" id="quoteBar" hidden><span id="quoteText"></span><button class="link" id="cancelQuote" aria-label="取消引用">✕</button></div><div class="input-row"><textarea id="input" rows="2" maxlength="4000" placeholder="输入本机演示消息…"></textarea><button class="primary" id="send">添加消息</button></div><p class="hint">Enter 添加 · Shift + Enter 换行；内容不会实际发送</p></div></main></div></div>
<div class="settings-wrap" id="settingsWrap" hidden><section class="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-header"><h2 id="settingsTitle">演示设置</h2><button class="soft" id="closeSettings" aria-label="关闭设置">关闭</button></div><p class="muted">以下名单仅作为本机界面配置示例，不会控制真实账号、消息或权限。每行一项。</p><label for="whitelist">白名单（演示）</label><textarea class="field" id="whitelist" maxlength="2000"></textarea><label for="blacklist">黑名单（演示）</label><textarea class="field" id="blacklist" maxlength="2000"></textarea><label for="admins">管理员（演示）</label><textarea class="field" id="admins" maxlength="2000"></textarea><label for="background">聊天背景颜色</label><input type="color" id="background"><label class="inline" for="sound"><input type="checkbox" id="sound">添加消息时播放本机提示音</label><div class="settings-actions"><button class="soft" id="testSound">试听提示音</button><button class="primary" id="saveSettings">保存设置</button></div><p class="status" id="settingsStatus" role="status"></p></section></div><div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
'use strict';
const KEY='qq-webchat-static-demo.v1';
const $=id=>document.getElementById(id);
const defaults=()=>({version:1,nickname:'我',selected:'c1',settings:{whitelist:'',blacklist:'',admins:'',background:'#f7f9fc',sound:false},contacts:[{id:'c1',name:'小林（示例）',unread:0,messages:[{id:'m1',from:'them',text:'你好！这是本机演示会话。',time:'10:18'},{id:'m2',from:'me',text:'你好，这里不会连接真实聊天服务。',time:'10:20'}]},{id:'c2',name:'项目小组（示例）',unread:2,messages:[{id:'m3',from:'them',text:'欢迎体验演示，点击会话可清除未读。',time:'09:30'},{id:'m4',from:'them',text:'消息、名单和设置都只在本机。',time:'09:32'}]},{id:'c3',name:'小雨（示例）',unread:1,messages:[{id:'m5',from:'them',text:'可以试试引用和撤回功能。',time:'昨天'}]}]});
let storageAvailable=true;
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaults();const x=JSON.parse(raw);if(!x||x.version!==1||!Array.isArray(x.contacts)||!x.settings||!x.contacts.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.messages)&&c.messages.every(m=>m&&typeof m.text==='string'&&typeof m.id==='string')))throw Error('invalid');return x}catch(e){storageAvailable=false;return defaults()}}
let state=load(),quote=null,toastTimer;
function storageNote(){ $('storageNotice').textContent=storageAvailable?'':' 本地存储不可用或数据异常，本次更改可能不会保留。'; }
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageAvailable=true}catch(e){storageAvailable=false}storageNote()}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function current(){return state.contacts.find(c=>c.id===state.selected)||state.contacts[0]}
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function setQuote(m){quote=m?{text:m.text,from:m.from==='me'?state.nickname:current().name}:null;$('quoteBar').hidden=!quote;$('quoteText').textContent=quote?'引用 '+quote.from+'：'+quote.text:''}
function render(){const c=current();if(!c)return;state.selected=c.id;$('chatName').textContent=c.name;document.documentElement.style.setProperty('--chat-bg',/^#[0-9a-f]{6}$/i.test(state.settings.background)?state.settings.background:'#f7f9fc');const list=$('contacts');list.replaceChildren();state.contacts.forEach(item=>{const b=el('button','contact'+(item.id===c.id?' active':''));b.type='button';b.setAttribute('aria-label',item.name+(item.unread?'，未读 '+item.unread+' 条':''));const av=el('span','avatar',item.name.slice(0,1));const info=el('span','contact-info');info.append(el('span','contact-name',item.name));const last=item.messages[item.messages.length-1];info.append(el('div','preview',last?(last.recalled?'消息已撤回':last.text):'暂无消息'));b.append(av,info);if(item.unread)b.append(el('span','badge',String(item.unread)));b.addEventListener('click',()=>{state.selected=item.id;item.unread=0;setQuote(null);$('workspace').classList.add('open');save();render()});list.append(b)});const area=$('messages');area.replaceChildren();if(!c.messages.length)area.append(el('div','empty','还没有消息，添加一条试试'));c.messages.forEach(m=>{const mine=m.from==='me',row=el('div','message'+(mine?' mine':''));row.append(el('div','avatar',mine?state.nickname.slice(0,1):c.name.slice(0,1)));const content=el('div','message-content');content.append(el('div','meta',(mine?state.nickname:c.name)+' · '+(m.time||'')));const bubble=el('div','bubble');if(m.quote&&!m.recalled)bubble.append(el('div','quoted',String(m.quote.from||'')+'：'+String(m.quote.text||'')));bubble.append(el('div','',m.recalled?'这条消息已在本机撤回':m.text));content.append(bubble);if(!m.recalled){const actions=el('div','actions');const reply=el('button','link','引用');reply.addEventListener('click',()=>{setQuote(m);$('input').focus()});actions.append(reply);if(mine){const recall=el('button','link','撤回');recall.addEventListener('click',()=>{m.recalled=true;m.text='';delete m.quote;save();render()});actions.append(recall)}content.append(actions)}row.append(content);area.append(row)});area.scrollTop=area.scrollHeight}
function sound(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('unsupported');const ctx=new Audio(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=660;gain.gain.setValueAtTime(.05,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.16);osc.onended=()=>ctx.close()}catch(e){notify('浏览器不支持提示音或已阻止播放')}}
function send(){const input=$('input'),text=input.value.trim(),c=current();if(!text||!c)return;const now=new Date();c.messages.push({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2),from:'me',text,time:now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),...(quote?{quote:{...quote}}:{})});input.value='';setQuote(null);save();render();if(state.settings.sound)sound()}
$('enter').addEventListener('click',()=>{state.nickname=$('nickname').value.trim().slice(0,30)||'我';$('login').hidden=true;save();render()});$('nickname').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});$('logout').addEventListener('click',()=>{$('login').hidden=false;$('nickname').value=state.nickname;$('workspace').classList.remove('open');setQuote(null)});$('send').addEventListener('click',send);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});$('cancelQuote').addEventListener('click',()=>setQuote(null));$('back').addEventListener('click',()=>$('workspace').classList.remove('open'));
$('openSettings').addEventListener('click',()=>{const s=state.settings;['whitelist','blacklist','admins'].forEach(k=>$(k).value=typeof s[k]==='string'?s[k]:'');$('background').value=/^#[0-9a-f]{6}$/i.test(s.background)?s.background:'#f7f9fc';$('sound').checked=!!s.sound;$('settingsStatus').textContent='';$('settingsWrap').hidden=false;$('closeSettings').focus()});function closeSettings(){$('settingsWrap').hidden=true;$('openSettings').focus()}$('closeSettings').addEventListener('click',closeSettings);$('settingsWrap').addEventListener('click',e=>{if(e.target===$('settingsWrap'))closeSettings()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('settingsWrap').hidden)closeSettings()});$('testSound').addEventListener('click',sound);$('saveSettings').addEventListener('click',()=>{state.settings={whitelist:$('whitelist').value,blacklist:$('blacklist').value,admins:$('admins').value,background:$('background').value,sound:$('sound').checked};save();render();$('settingsStatus').textContent=storageAvailable?'设置已保存在本机。':'设置仅在当前页面有效，无法写入本地存储。'});$('reset').addEventListener('click',()=>{if(!confirm('重置全部本机示例消息和设置？此操作无法撤销。'))return;state=defaults();setQuote(null);$('input').value='';$('workspace').classList.remove('open');save();render();notify('已重置本机示例数据')});$('nickname').value=typeof state.nickname==='string'?state.nickname:'我';storageNote();render();
})();
</script>
</body></html>
